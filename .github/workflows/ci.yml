name: CI
on: [push, pull_request]
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-superuser }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-superuser
      CB_TEST_DATABASE_URL: postgresql+psycopg://cb_app:ci-app@127.0.0.1:5432/consentbridge_test
      CB_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://cb_owner:ci-owner@127.0.0.1:5432/consentbridge_test
      CB_TEST_SUPERUSER_URL: postgresql+psycopg://postgres:ci-only-superuser@127.0.0.1:5432/postgres
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: psql -h 127.0.0.1 -U postgres -c "CREATE ROLE cb_owner LOGIN PASSWORD 'ci-owner'" -c "CREATE ROLE cb_app LOGIN PASSWORD 'ci-app'"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
