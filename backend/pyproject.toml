[project]
name = "consentbridge-api"
version = "1.0.0"
description = "ConsentBridge API - privacy-first healthcare data sharing (synthetic data only)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/0001_initial_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S105", "S106", "S608", "B008", "RUF012", "UP017", "S311", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501", "RUF001", "SIM117"]
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["migrations/", "tests/"]
