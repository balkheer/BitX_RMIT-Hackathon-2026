# ConsentBridge production stack: Postgres, one-shot migrations, API, Caddy edge (TLS), backups, audit checkpoints.
# Usage (from repo root):  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: consentbridge

x-api-env: &api-env
  CB_ENVIRONMENT: production
  CB_TIDECLOAK_CONFIG_PATH: /run/config/tidecloak.json
  CB_TRUSTED_HOSTS: ${CB_DOMAIN},api,localhost,127.0.0.1
  CB_CORS_ALLOWED_ORIGINS: https://${CB_DOMAIN}
  CB_AGGREGATE_MIN_GROUP_SIZE: ${CB_AGGREGATE_MIN_GROUP_SIZE:-5}
  CB_LOG_LEVEL: INFO

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: consentbridge
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    networks: [backend]          # not published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consentbridge"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ../backend
    restart: "no"
    depends_on: { db: { condition: service_healthy } }
    secrets: [pg_owner_password]
    environment:
      CB_APP_DB_ROLE: cb_app
    entrypoint: ["/bin/sh", "-c", "export CB_MIGRATION_DATABASE_URL=postgresql+psycopg://cb_owner:$$(cat /run/secrets/pg_owner_password)@db:5432/consentbridge CB_DATABASE_URL=$$CB_MIGRATION_DATABASE_URL && alembic upgrade head"]
    networks: [backend]

  bootstrap:
    build: ../backend
    restart: "no"
    depends_on: { migrate: { condition: service_completed_successfully } }
    secrets: [pg_app_password]
    environment: *api-env
    volumes: ["${CB_TIDECLOAK_ADAPTER_PATH:?set CB_TIDECLOAK_ADAPTER_PATH}:/run/config/tidecloak.json:ro"]
    entrypoint: ["/bin/sh", "-c", "export CB_DATABASE_URL=postgresql+psycopg://cb_app:$$(cat /run/secrets/pg_app_password)@db:5432/consentbridge && python -m app.cli bootstrap"]
    networks: [backend]

  api:
    build: ../backend
    restart: unless-stopped
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    secrets: [pg_app_password]
    environment: *api-env
    volumes: ["${CB_TIDECLOAK_ADAPTER_PATH}:/run/config/tidecloak.json:ro"]
    entrypoint: ["/bin/sh", "-c", "export CB_DATABASE_URL=postgresql+psycopg://cb_app:$$(cat /run/secrets/pg_app_password)@db:5432/consentbridge && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log --proxy-headers --forwarded-allow-ips '*'"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment:
      CB_DOMAIN: ${CB_DOMAIN:?set CB_DOMAIN}
      CB_ACME_EMAIL: ${CB_ACME_EMAIL:?set CB_ACME_EMAIL}
      CB_CSP_IDP_ORIGINS: ${CB_CSP_IDP_ORIGINS:?set CB_CSP_IDP_ORIGINS}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - "${CB_TIDECLOAK_ADAPTER_PATH}:/config-public/tidecloak.json:ro"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    secrets: [pg_superuser_password]
    environment:
      BACKUP_RETENTION_DAYS: ${CB_BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${CB_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${CB_BACKUP_DIR:-./backups}:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "loop"]
    networks: [backend]

  audit-checkpoint:
    build: ../backend
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    secrets: [pg_app_password]
    environment: *api-env
    volumes:
      - "${CB_TIDECLOAK_ADAPTER_PATH}:/run/config/tidecloak.json:ro"
      - ${CB_CHECKPOINT_DIR:-./audit-checkpoints}:/checkpoints
    # Verifies the whole chain hourly and appends the head hash to a file outside the database.
    # Ship /checkpoints to separate, write-once storage to detect truncation or rewriting.
    entrypoint: ["/bin/sh", "-c", "export CB_DATABASE_URL=postgresql+psycopg://cb_app:$$(cat /run/secrets/pg_app_password)@db:5432/consentbridge; while true; do date -u +%FT%TZ | tr -d '\\n' >> /checkpoints/heads.log; echo -n ' ' >> /checkpoints/heads.log; python -m app.cli verify-audit | tr -d '\\n ' >> /checkpoints/heads.log; echo >> /checkpoints/heads.log; sleep 3600; done"]
    networks: [backend]

secrets:
  pg_superuser_password: { file: ./secrets/pg_superuser_password }
  pg_owner_password: { file: ./secrets/pg_owner_password }
  pg_app_password: { file: ./secrets/pg_app_password }

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  backend: { internal: true }
  edge: {}
