# Local development services: PostgreSQL and a TideCloak dev server (image per docs.tide.org quickstart).
# docker compose -f deploy/docker-compose.dev.yml up -d
name: consentbridge-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CB_DEV_PG_SUPERUSER_PASSWORD:-change-me-local-only}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./postgres/dev-init.sql:/docker-entrypoint-initdb.d/10-dev-init.sql:ro

  tidecloak:
    image: tideorg/tidecloak-dev:latest
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CB_DEV_TIDECLOAK_ADMIN_PASSWORD:-change-me-local-only}
    volumes:
      - tidecloak-dev:/opt/keycloak/data/h2

volumes:
  pgdata-dev:
  tidecloak-dev:
